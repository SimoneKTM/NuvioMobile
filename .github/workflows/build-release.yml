name: Build All Releases (Windows, Android Mobile)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch da compilare'
        required: false
        default: 'app/enhanced'
        type: string
  push:
    branches:
      - "app/enhanced"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target branch
        id: resolve_branch
        run: |
          INPUT_BRANCH="${{ github.event.inputs.target_branch }}"
          if [ -z "$INPUT_BRANCH" ]; then
            CHOSEN_BRANCH="${{ github.ref_name }}"
          else
            CHOSEN_BRANCH="$INPUT_BRANCH"
          fi
          echo "branch=$CHOSEN_BRANCH" >> $GITHUB_OUTPUT
          echo "Selected branch: $CHOSEN_BRANCH"

      - name: Checkout target branch code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_branch.outputs.branch }}
          fetch-depth: 0
          lfs: false

      - name: Read version.json
        id: version
        run: |
          VERSION=$(jq -r '.version // empty' version.json)
          if [ -z "$VERSION" ]; then
            echo "Error: version.json missing 'version' key"
            exit 1
          fi
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$(echo "$VERSION" | tr -d '.')" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/nuvio-release.keystore

      - name: Write local.properties
        run: |
          printf 'SUPABASE_URL=%s\n' "${{ secrets.SUPABASE_URL }}" > local.properties
          printf 'SUPABASE_ANON_KEY=%s\n' "${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          printf 'TRAKT_CLIENT_ID=%s\n' "${{ secrets.TRAKT_CLIENT_ID }}" >> local.properties
          printf 'TRAKT_CLIENT_SECRET=%s\n' "${{ secrets.TRAKT_CLIENT_SECRET }}" >> local.properties
          printf 'TRAKT_REDIRECT_URI=%s\n' "${{ secrets.TRAKT_REDIRECT_URI }}" >> local.properties
          printf 'ANILIST_CLIENT_ID=%s\n' "${{ secrets.ANILIST_CLIENT_ID }}" >> local.properties
          printf 'ANILIST_CLIENT_SECRET=%s\n' "${{ secrets.ANILIST_CLIENT_SECRET }}" >> local.properties
          printf 'ANILIST_REDIRECT_URI=%s\n' "${{ secrets.ANILIST_REDIRECT_URI }}" >> local.properties
          printf 'MAL_CLIENT_ID=%s\n' "${{ secrets.MAL_CLIENT_ID }}" >> local.properties
          printf 'MAL_REDIRECT_URI=%s\n' "${{ secrets.MAL_REDIRECT_URI }}" >> local.properties
          printf 'INTRODB_API_URL=%s/\n' "${{ secrets.INTRODB_API_URL }}" >> local.properties
          printf 'TMDB_API_KEY=%s\n' "${{ secrets.TMDB_API_KEY }}" >> local.properties
          printf 'NUVIO_RELEASE_STORE_FILE=%s/nuvio-release.keystore\n' "${{ github.workspace }}" >> local.properties
          printf 'NUVIO_RELEASE_STORE_PASSWORD=%s\n' ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }} >> local.properties
          printf 'NUVIO_RELEASE_KEY_ALIAS=%s\n' "nuvio-release" >> local.properties
          printf 'NUVIO_RELEASE_KEY_PASSWORD=%s\n' ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }} >> local.properties
          printf 'DONATIONS_BASE_URL=%s\n' "https://donations.nuvioapp.space/" >> local.properties
          printf 'DONATIONS_DONATE_URL=%s\n' "https://ko-fi.com/tapframe" >> local.properties
          printf 'CONTRIBUTIONS_URL=%s\n' "${{ secrets.CONTRIBUTION_URL }}" >> local.properties
          printf 'DIRECT_DEBRID_API_BASE_URL=%s\n' "https://api.torbox.app/v1/api" >> local.properties
          printf 'SIMKL_CLIENT_ID=%s\n' "${{ secrets.SIMKL_CLIENT_ID }}" >> local.properties

      - name: Generate Changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log HEAD --pretty=format:"- %s (%h)" --no-merges -n 20)
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- Nessuna modifica rilevata rispetto alla release precedente"
          fi

          {
            echo "## ?? Changes"
            echo ""
            echo "$COMMITS"
          } > release_body.md

      - name: Build Full Release APK
        run: |
          ./gradlew clean :composeApp:assembleFullRelease --no-build-cache --no-configuration-cache

      - name: Rename APK
        run: |
          APK_DIR="composeApp/build/outputs/apk"
          find "$APK_DIR" -name "*.apk" | while read apk; do
            FNAME=$(basename "$apk")
            case "$FNAME" in
              *arm64-v8a*) ABI="arm64-v8a";;
              *armeabi-v7a*) ABI="armeabi-v7a";;
              *x86_64*) ABI="x86_64";;
              *x86*) ABI="x86";;
              *universal*) ABI="universal";;
              *) ABI="release";;
            esac
            DIR=$(dirname "$apk")
            mv "$apk" "$DIR/NuvioEnhanced-${{ steps.version.outputs.name }}-$ABI.apk"
          done
          find "$APK_DIR" -name "*.apk" | sort

      - name: Upload split APKs as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-apks-v${{ steps.version.outputs.name }}
          path: composeApp/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Debug generated configs
        run: |
          echo "=== TraktConfig.kt ==="
          cat composeApp/build/generated/runtime-config/kotlin/com/nuvio/app/features/trakt/TraktConfig.kt 2>/dev/null || echo "File not found"
          echo ""
          echo "=== local.properties ==="
          grep -E "TRAKT|ANILIST|MAL" local.properties 2>/dev/null || echo "No secrets found"

      - name: Create GitHub Release and Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v${{ steps.version.outputs.name }}"

          if gh release view "$RELEASE_TAG" --json id &>/dev/null; then
            echo "Release tag $RELEASE_TAG already exists, uploading APK..."
            find composeApp/build/outputs/apk -name "*.apk" -exec gh release upload "$RELEASE_TAG" {} --clobber \;
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" \
              --title "Nuvio v${{ steps.version.outputs.name }}" \
              --notes-file release_body.md \
              --target ${{ steps.resolve_branch.outputs.branch }}
            find composeApp/build/outputs/apk -name "*.apk" -exec gh release upload "$RELEASE_TAG" {} --clobber \;
          fi

      - name: Send ntfy Notification
        run: |
          curl \
            -H "Title: ?? Android Build Completata!" \
            -H "Priority: high" \
            -H "Tags: rocket,android" \
            -H "Click: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.name }}" \
            -d "Build **Android v${{ steps.version.outputs.name }}** pronta! ?? APK caricato." \
            https://ntfy.sh/nuvio_builds

  build-desktop:
    runs-on: windows-latest
    needs: build-android

    steps:
      - name: Resolve target branch
        id: resolve_branch
        run: |
          $inputBranch = "${{ github.event.inputs.target_branch }}"
          if ([string]::IsNullOrEmpty($inputBranch)) {
            $chosenBranch = "${{ github.ref_name }}"
          } else {
            $chosenBranch = $inputBranch
          }
          echo "branch=$chosenBranch" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "Selected branch: $chosenBranch"

      - name: Checkout target branch code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_branch.outputs.branch }}
          fetch-depth: 0
          lfs: false

      - name: Read version.json
        id: version
        shell: pwsh
        run: |
          $json = Get-Content -Raw version.json | ConvertFrom-Json
          $version = $json.version
          if ([string]::IsNullOrEmpty($version)) {
            Write-Host "Error: version.json missing 'version' key"
            exit 1
          }
          echo "name=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "code=$($version -replace '\.', '')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $version"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write local.properties
        shell: pwsh
        run: |
          @"
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI=${{ secrets.TRAKT_REDIRECT_URI }}
          ANILIST_CLIENT_ID=${{ secrets.ANILIST_CLIENT_ID }}
          ANILIST_CLIENT_SECRET=${{ secrets.ANILIST_CLIENT_SECRET }}
          ANILIST_REDIRECT_URI=${{ secrets.ANILIST_REDIRECT_URI }}
          MAL_CLIENT_ID=${{ secrets.MAL_CLIENT_ID }}
          MAL_REDIRECT_URI=${{ secrets.MAL_REDIRECT_URI }}
          INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}/
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          DONATIONS_BASE_URL=https://donations.nuvioapp.space/
          DONATIONS_DONATE_URL=https://ko-fi.com/tapframe
          CONTRIBUTIONS_URL=${{ secrets.CONTRIBUTION_URL }}
          DIRECT_DEBRID_API_BASE_URL=https://api.torbox.app/v1/api
          SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}
          "@ | Out-File -FilePath local.properties -Encoding utf8

      - name: Install WebView2 SDK (NuGet)
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory $env:UserProfile\.nuget\packages
          echo "WebView2 SDK installed"

      - name: Download libmpv-2.dll
        shell: pwsh
        run: |
          $dllDir = "composeApp/src/desktopMain/native/windows/runtime"
          New-Item -ItemType Directory -Force -Path $dllDir | Out-Null
          $dllPath = Join-Path $dllDir "libmpv-2.dll"
          Write-Host "Downloading libmpv-2.dll from NuvioDesktop..."
          Invoke-WebRequest -Uri "https://github.com/NuvioMedia/NuvioDesktop/raw/refs/heads/Dev/composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll" -OutFile $dllPath -UseBasicParsing
          $size = (Get-Item $dllPath).Length
          Write-Host "Downloaded: $([math]::Round($size/1MB, 1)) MB"

      - name: Download TorrServer Windows binary
        shell: pwsh
        run: |
          $runtimeDir = "composeApp/src/desktopMain/native/windows/runtime"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $releaseJson = Invoke-RestMethod -Uri "https://releases.yourok.ru/torr/server_release.json"
          $url = $releaseJson."windows-amd64.exe"
          if ([string]::IsNullOrEmpty($url)) {
            Write-Host "ERROR: no windows-amd64.exe URL in server_release.json"
            exit 1
          }
          Write-Host "Downloading TorrServer from: $url"
          Invoke-WebRequest -Uri $url -OutFile (Join-Path $runtimeDir "torrserver.exe") -UseBasicParsing
          $size = (Get-Item (Join-Path $runtimeDir "torrserver.exe")).Length
          Write-Host "Downloaded TorrServer: $([math]::Round($size/1MB, 1)) MB"

      - name: Set up Go for wireguard-go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build wireguard-go.exe
        shell: pwsh
        run: |
          $runtimeDir = "composeApp/src/desktopMain/native/windows/runtime"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          git clone --depth 1 https://github.com/WireGuard/wireguard-go.git "$env:RUNNER_TEMP/wireguard-go"
          Push-Location "$env:RUNNER_TEMP/wireguard-go"
          try {
            go build -o "$env:GITHUB_WORKSPACE/$runtimeDir/wireguard-go.exe" .
          } finally {
            Pop-Location
          }
          $size = (Get-Item "$env:GITHUB_WORKSPACE/$runtimeDir/wireguard-go.exe").Length
          Write-Host "Built wireguard-go: $([math]::Round($size/1MB, 1)) MB"

      - name: Download wintun.dll
        shell: pwsh
        run: |
          $runtimeDir = "composeApp/src/desktopMain/native/windows/runtime"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $zip = "$env:RUNNER_TEMP/wintun.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP/wintun" -Force
          Copy-Item "$env:RUNNER_TEMP/wintun/amd64/wintun.dll" (Join-Path $runtimeDir "wintun.dll") -Force
          Write-Host "wintun.dll copied"

      - name: Extract wg.exe from WireGuard MSI
        shell: pwsh
        run: |
          $runtimeDir = "composeApp/src/desktopMain/native/windows/runtime"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $msi = "$env:RUNNER_TEMP/wireguard.msi"
          Invoke-WebRequest -Uri "https://download.wireguard.com/windows-client/wireguard-amd64-1.1.msi" -OutFile $msi -UseBasicParsing
          $extractDir = "$env:RUNNER_TEMP/wg-extract"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          $extracted = $false
          try {
            & msiexec.exe /a $msi /qn TARGETDIR="$extractDir" | Out-Null
            if ($LASTEXITCODE -eq 0) { $extracted = $true }
          } catch {
            $extracted = $false
          }
          if (-not $extracted -or -not (Get-ChildItem -Recurse -Path $extractDir -Filter "wg.exe" -ErrorAction SilentlyContinue)) {
            Write-Host "msiexec extraction failed, trying 7z..."
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
            if (-not (Test-Path $sevenZip)) { Write-Host "7z not found"; exit 1 }
            & $sevenZip x $msi -o"$extractDir" -y | Out-Null
          }
          $wgExe = Get-ChildItem -Recurse -Path $extractDir -Filter "wg.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wgExe) {
            Write-Host "ERROR: wg.exe not found in extracted MSI"
            exit 1
          }
          Copy-Item $wgExe.FullName (Join-Path $runtimeDir "wg.exe") -Force
          Write-Host "wg.exe copied from $($wgExe.FullName)"

      - name: Build Windows MSI
        shell: pwsh
        run: |
          ./gradlew clean :composeApp:packageReleaseMsi --no-build-cache --no-configuration-cache

      - name: Locate MSI artifact
        id: msi
        shell: pwsh
        run: |
          $releaseMsiDir = "composeApp/build/compose/release-msis"
          $binaryDir = "composeApp/build/compose/binaries/main-release/msi"
          if (Test-Path $releaseMsiDir) {
            $msi = Get-ChildItem -Path $releaseMsiDir -Filter "*.msi" | Select-Object -First 1
            if ($msi) {
              echo "msi-path=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              echo "msi-name=$($msi.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "Found MSI at: $($msi.FullName)"
              exit 0
            }
          }
          if (Test-Path $binaryDir) {
            $msi = Get-ChildItem -Path $binaryDir -Filter "*.msi" | Select-Object -First 1
            if ($msi) {
              echo "msi-path=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              echo "msi-name=$($msi.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "Found MSI at: $($msi.FullName)"
              exit 0
            }
          }
          Write-Host "No MSI found in expected paths"
          Get-ChildItem -Recurse -Path "composeApp/build" -Filter "*.msi" | ForEach-Object {
            Write-Host "  Found: $($_.FullName)"
          }
          exit 1

      - name: Upload MSI to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseTag = "v${{ steps.version.outputs.name }}"
          $msiPath = "${{ steps.msi.outputs.msi-path }}"

          Write-Host "Uploading $msiPath to tag $releaseTag..."

          $maxRetries = 30
          $retry = 0
          while ($retry -lt $maxRetries) {
            $release = gh release view "$releaseTag" --json id 2>$null
            if ($release) {
              Write-Host "Release found, uploading..."
              gh release upload "$releaseTag" "$msiPath" --clobber
              if ($LASTEXITCODE -eq 0) {
                Write-Host "MSI uploaded successfully!"
                exit 0
              }
              Write-Host "Upload failed, retrying..."
            } else {
              Write-Host "Release not yet created, retry $retry/$maxRetries..."
            }
            $retry++
            Start-Sleep -Seconds 10
          }
          Write-Host "Timeout waiting for Android release"
          exit 1

      - name: Send ntfy Notification
        shell: pwsh
        run: |
          curl.exe -H "Title: ?? Desktop Build Completata!" -H "Priority: high" -H "Tags: rocket,windows" -H "Click: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.name }}" -d "Build **Desktop Windows v${{ steps.version.outputs.name }}** pronta! ?? MSI caricato." https://ntfy.sh/nuvio_builds
