          printf 'TMDB_API_KEY=%s\n' " ${{ secrets.TMDB_API_KEY }}" >> local.propert ies
          printf 'NUVIO_RELEASE_STORE_FIL E=%s/nuvio-release.keystore\n' "${{ github.wo rkspace }}" >> local.properties
