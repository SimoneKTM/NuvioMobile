          printf  'TRAKT_CLIENT_SECRET=%s\n' "${{ secrets.TRAKT _CLIENT_SECRET }}" >> local.properties
           printf 'TRAKT_REDIRECT_URI=%s\n' "${{ sec rets.TRAKT_REDIRECT_URI }}" >> local.properti es
