          printf 'DONATI ONS_DONATE_URL=%s\n' "https://ko-fi.com/tapfr ame" >> local.properties
          printf 'CO NTRIBUTIONS_URL=%s\n' "${{ secrets.CONTRIBUTI ON_URL }}" >> local.properties
          prin tf 'DIRECT_DEBRID_API_BASE_URL=%s\n' "https:/ /api.torbox.app/v1/api" >> local.properties

       - name: Generate Changelog
        id:  changelog
        env:
          GH_TOKEN: ${ { secrets.GITHUB_TOKEN }}
        run: |
           PREV_TAG=$(gh release list --limit 1 -- json tagName -q '.[0].tagName' 2>/dev/null ||  echo "")

          if [ -n "$PREV_TAG" ]; t hen
            COMMITS=$(git log "${PREV_TAG }..HEAD" --pretty=format:"- %s (%h)" --no-mer ges)
          else
            COMMITS=$(git  log HEAD --pretty=format:"- %s (%h)" --no-me rges -n 20)
          fi

          if [ -z " $COMMITS" ]; then
            COMMITS="- Ness una modifica rilevata rispetto alla release p recedente"
          fi

          {
             echo "## 🔨 Changes"
            echo " "
            echo "$COMMITS"
          } > r elease_body.md

      - name: Build Full Rele ase APK
        run: |
          ./gradlew :c omposeApp:assembleFullRelease

      - name:  Rename APK
        run: |
          APK_DIR=" composeApp/build/outputs/apk"
          find  "$APK_DIR" -name "*.apk" | while read apk; do 
            DIR=$(dirname "$apk")
             mv "$apk" "$DIR/NuvioEnhanced-${{ steps.ver sion.outputs.name }}.apk"
          done

       - name: Create GitHub Release and Upload A PK
        env:
          GH_TOKEN: ${{ secre ts.GITHUB_TOKEN }}
        run: |
          R ELEASE_TAG="v${{ steps.version.outputs.name } }"

          if gh release view "$RELEASE_TA G" --json id &>/dev/null; then
