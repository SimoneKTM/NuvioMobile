            find composeApp /build/outputs/apk -name "*.apk" -exec gh rel ease upload "$RELEASE_TAG" {} --clobber \;
           else
            echo "Creating relea se $RELEASE_TAG..."
            gh release cr eate "$RELEASE_TAG" \
              --title " Nuvio v${{ steps.version.outputs.name }}" \
               --notes-file release_body.md \
               --target ${{ steps.resolve_branc h.outputs.branch }}
            find composeA pp/build/outputs/apk -name "*.apk" -exec gh r elease upload "$RELEASE_TAG" {} --clobber \;
           fi

      - name: Send ntfy Notific ation
        run: |
          curl \
             -H "Title: 🎉 Android Build Completata !" \
            -H "Priority: high" \
             -H "Tags: rocket,android" \
             -H "Click: https://github.com/${{ github.rep ository }}/releases/tag/v${{ steps.version.ou tputs.name }}" \
            -d "Build **Andr oid v${{ steps.version.outputs.name }}** pron ta! 🚀 APK caricato." \
            https:/ /ntfy.sh/nuvio_builds

  build-desktop:
