          e cho "name=$version" | Out-File -FilePath $env :GITHUB_OUTPUT -Encoding utf8 -Append
           echo "code=$($version -replace '\.', '')"  | Out-File -FilePath $env:GITHUB_OUTPUT -Enco ding utf8 -Append
          Write-Host "Versi on: $version"

